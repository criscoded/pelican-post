<div class="container">
  <header>
    <h1>Cloud Spark Gallery</h1>
    <div class="upload-section">
      <input type="file" (change)="onFileSelected($event)" accept="image/*" #fileInput hidden>
      <button (click)="fileInput.click()" [disabled]="uploading()">
        {{ uploading() ? 'Uploading...' : 'Upload Image' }}
      </button>
    </div>
  </header>

  <main>
    @if(images().length > 0) {
      <div class="gallery-grid">
      @for(img of images(); track img.id) {
        <div class="image-card">
          <img [src]="img.url" [alt]="img.originalFileName">
          <div class="image-info">
            <span class="file-name">{{ img.originalFileName }}</span>
            <button class="delete-btn" (click)="deleteImage(img.id)">Delete</button>
          </div>
        </div>
      }
      </div>
    } @else {
      <div class="empty-msg">
        <p>No images found. Upload your first image!</p>
      </div>
    }

  </main>
</div>
