spring.application.name=Gallery API
server.port=${PORT:8080}

# --- Database (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:gallery_db}
spring.datasource.username=${DB_USERNAME:gallery}
spring.datasource.password=${DB_PASSWORD:gallery}

# Auto create/update table based on Java Entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- AWS S3 / CloudFront ---
spring.cloud.aws.s3.bucket=${AWS_BUCKET_NAME}
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
spring.cloud.aws.region.static=${AWS_REGION}
app.cdn.base-url=${CDN_BASE_URL:https://d3kygt2aqhuo2y.cloudfront.net/}

# --- Auth (JWT) ---
# JWT_SECRET must be a Base64-encoded key of at least 256 bits
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# --- CORS ---
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}

# --- Upload limits ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.tomcat.max-swallow-size=-1
