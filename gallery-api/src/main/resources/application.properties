spring.application.name=Gallery API

spring.cloud.aws.s3.bucket=amzn-s3-bucket-spring-react-gallery
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
spring.cloud.aws.region.static=${AWS_REGION}

# Auto create/update table based on Java Entities
spring.jpa.hibernate.ddl-auto=update
# Logging
spring.jpa.show-sql=true

# SET UPLOAD SIZE LIMIT
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# SET TOMCAT TO ALLOW ANY DATA SIZE
# allows JSON errors to propagate
server.tomcat.max-swallow-size=-1